services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quotaflow
      MYSQL_USER: quotaflow
      MYSQL_PASSWORD: quotaflow
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["mysql-data:/var/lib/mysql"]
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/quotaflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: quotaflow
      DB_PASSWORD: quotaflow
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:

