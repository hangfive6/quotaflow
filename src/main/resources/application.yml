spring:
  application:
    name: quotaflow
  datasource:
    url: jdbc:h2:mem:quotaflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
app:
  reservation-ttl: PT15M
  rate-limit-per-second: 30
springdoc:
  swagger-ui:
    path: /swagger-ui.html

